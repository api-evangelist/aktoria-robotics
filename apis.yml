name: Aktoria Robotics
description: >-
  Aktoria Robotics is a San Francisco-based robotics company (Y Combinator Summer
  2026 batch) building a teleoperation and remote-operation layer for robots under
  the banner "Human as API for Robots." Its platform lets operators run any robot
  anywhere in the world, remotely collecting operational data from robot fleets 24
  hours a day, monitoring and intervening in deployed fleets, and moving hardware
  through a train-to-deploy-to-monitor lifecycle. Founded in 2026 by Shreenabh
  Agrawal (robotics, Carnegie Mellon University) and Jaskaran Singh Walia
  (previously a researcher at Microsoft, MIT, CMU, Cambridge, and NUS), the company
  is at the pre-product-launch stage and does not yet publish a public developer
  API, SDKs, or documentation.
